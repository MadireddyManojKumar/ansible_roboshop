- name: User microservice
  hosts: user
  become: yes
  vars:
    user_app_user: roboshop
    mysql_host: mysql-manojkumar.blog
    mongo_host: mongodb-manojkumar.blog
  tasks:
  - name: disable default nodejs
    command: dnf module disable nodejs -y

  - name: enable nodejs version 24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    package:
      name: nodejs
      state: present  

  - name: verify nodejs version
    command: node -v
    register: nodejs_version

  - name: print nodejs version
    debug:
      msg: "Nodejs version is {{ nodejs_version.stdout }}"

  - name: create roboshop user
    user:
      name: roboshop
      create_home: no
      system: yes
      home: /app
      comment: "roboshop system user"
      shell: /sbin/nologin

  - name: remove default application directory
    file:
      path: /app
      state: absent

  - name: create application directory
    file:
      path: /app
      state: directory

  - name: download user microservice
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
      dest: /tmp/user.zip

  - name: unzip user microservice
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes


  - name: install nodejs dependencies
    community.general.npm:
      path: /app


  - name: copy user service
    template:
      src: user.service.j2
      dest: /etc/systemd/system/user.service

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: start and enable user
    service:
      name: user
      state: restarted
      enabled: yes
  

  