# Ansible script to setup redis for Roboshop application

- name: "Setup Redis for Roboshop application"
  hosts: redis
  become: true
  tasks:
    - name: disable redis default version
      command: dnf module disable redis -y
      
    
    - name: Enable redis 7.0 module
      command: dnf module enable redis:7 -y
      

    - name: Install redis 7.0
      package:
        name: redis
        state: present

    - name:  configure redis to listen on all interfaces
      replace:
        path: /etc/redis/redis.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'

    - name: change redis protected mode to no
      replace:
        path: /etc/redis/redis.conf
        regexp: 'protected-mode yes'
        replace: 'protected-mode no' 
