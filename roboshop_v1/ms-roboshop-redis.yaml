# Ansible script to setup redis for Roboshop application

- name: "Setup Redis for Roboshop application"
  hosts: redis
  become: true
  tasks:
    - name: disable redis default version
      command: dnf module disable redis -y
      
    
    - name: Enable redis 7.0 module
      command: dnf module enable redis:7.0 -y
      

    - name: Install redis 7.0
      package:
        name: redis
        state: present

    - name:  configure redis to listen on all interfaces
      replace:
        regexp: '27.0.0.1'
        replace: '0.0.0.0'

    - name: change redis protected mode to no
      replace:
        regexp: 'protected-mode yes'
        replace: 'protected-mode no' 

    - name: enable and start redis service
      ansible.builtin.service:
        name: redis
        enabled: true
        state: started
    
    - name: "Check redis service status"
      command: systemctl status redis
      register: result
      ignore_errors: true

    - name: "Print redis service status"
      debug:
        var: result.stdout_lines


    - name: verify redis listening port
      command: netstat -tulnp | grep 6379
      register: redis_port_status

    - name: display redis listening port status
      debug:
        var: redis_port_status.stdout

    -
    - name: Ping test on redis service
      ansible.builtin.ping:
        data: Ping

    - name: success message
      debug:
        msg: "Redis deployment completed successfully."
