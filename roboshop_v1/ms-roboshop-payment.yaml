- name: Payment service deployment using ansible script.
  hosts: payment
  become: true
  vars:
    rabbitmq_host: rabbitmq.manojkumar.blog
    cart_host: cart.manojkumar.blog
    user_host: user.manojkumar.blog
  tasks:
    - name: Install Python version
      package:
        name: "{{item}}"
        state: present
      loop:
        - python3.14
        - python3.14-pip

    - name: add system user for payment service
      user:
        name: roboshop
        system: true
        shell: /sbin/nologin
        create_home: no
        home: /app
        comment: "roboshop system user"

    - name: Remove app directory if exist
      file:
        path: /app
        state: absent

    - name: remove zip file if exist
      file:
        path: /tmp/payment.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory


    - name: download source code
      get_url:
        src: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
        dest: /tmp/payment.zip

   

    - name: unzip the source file
      unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: install dependencies in virtual environment
      ansible.builtin.pip:
        requirements: /app/erquirements.text
        virtualenv: /app/.env
        virtualenv_command: python3.14 -m venv


    - name: copy payment service
      template:
        src: payment.service.j2
        dest: /etc/systemd/system/payment.service

    - name: daemon reload
      systemd_service:
        daemon_reload: true

    - name: start and enable payment
      service:
        name: payment
        state: restarted
        enabled: yes





