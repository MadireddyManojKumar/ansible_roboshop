- name: roboshop-mongodb create ec2 instances
  connection: local
  hosts: local
  vars:
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    domain_name: daws.manojkumar.blog
    action: create
  tasks:
    - name: create ec2 instances
      amazon.aws.ec2_instance:
        name: roboshop-{{item}}
        image_id: "{{ ami_id }}"
        instance_type: "{{instance_type}}"
        security_groups: 
        - "roboshop-{{item}}"
        - "roboshop-common"
        region: us-east-1
      loop: "{{instances}}"
      when: action == "create"
      register: ec2_instance_creation_output
    
    - name: ec2 instance creation output
      debug:  
        msg: "{{ec2_instance_creation_output}}"

        




      
      

