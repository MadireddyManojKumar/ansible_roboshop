- name: cart microservice
  hosts: cart
  become: yes
  vars: 
    cart_app_user: roboshop
    mysql_host: mysql-manojkumar.blog
    mongo_host: mongodb-manojkumar.blog
    cart_host: cart-manojkumar.blog
    catalogue_host: catalogue-manojkumar.blog
  tasks:
  - name: disable default nodejs
    command: dnf module disable nodejs -y

  - name: enable nodejs version 24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    package:
      name: nodejs
      state: present

  - name: verify nodejs version
    command: node -v
    register: nodejs_version
  
  - name: print nodejs version
    debug:
      msg: "Nodejs version is {{ nodejs_version.stdout }}"

  - name: create roboshop user
    user:
      name: roboshop
      create_home: no
      system: yes
      home: /app
      comment: "roboshop system user"
      shell: /sbin/nologin

  - name: remove default application directory
    file:
      path: /app
      state: absent


  - name: create application directory
    file:
      path: /app
      state: directory

  - name: download cart microservice
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
      dest: /tmp/cart.zip

  - name: unzip cart microservice
    unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: change directory to /app
    command: chdir=/app
    
  - name: install nodejs dependencies
    command: chdir=/app npm install

  - name: update systemd service file
    template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service

  - name: reload systemd
    systemd_service:
      daemon_reload: yes

  - name: start cart service
    ansible.builtin.service:
      name: cart
      state: started
      enabled: yes


  
  